protoc_version: "32.1"
cache_dir: ".cache/atbuild"
tools_dir: ".cache/atbuild/tools"
tools_modfile: "tools.mod"
standalone_modules:
  - "."
  - "sample/sample_usage_01"

proto_targets:
  - name: "libatbus-protocol"
    stage: 0
    work_dir: "protocol"
    proto_paths:
      - "."
    files:
      - "*.proto"
    go_out: "."
    mutable_out: "."
    go_opt: "paths=source_relative"
    mutable_opt: "paths=source_relative"
